name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test -race ./...

      - name: Build release archive
        run: |
          set -euo pipefail
          name="pgtrace-agent_${GITHUB_REF_NAME}_linux_amd64"
          mkdir -p "dist/$name"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/$name/pgtrace-agent" ./cmd/pgtrace-agent
          "dist/$name/pgtrace-agent" -version
          cp LICENSE README.md docs/metrics.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > checksums.txt)

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pgtrace-agent
          labels: |
            org.opencontainers.image.title=pgtrace-agent
            org.opencontainers.image.description=eBPF agent tracing queries through pgbouncer to postgres (OpenTelemetry traces, Prometheus metrics)
            org.opencontainers.image.licenses=MIT
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/pgtrace-agent:${GITHUB_REF_NAME#v}"
          # actions/checkout replaces an annotated tag with a lightweight one;
          # fetch it again so the tag message (the changelog) is available.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          changes=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          if [[ -n "${changes//[[:space:]]/}" ]]; then
            printf '## Changes\n\n%s\n\n' "$changes" > notes.md
          else
            : > notes.md
          fi
          cat >> notes.md <<NOTES
          ## Container image

          \`\`\`bash
          docker pull ${image}
          docker run --rm --privileged --pid host \\
            -v /sys/kernel/tracing:/sys/kernel/tracing \\
            ${image} -otlp-endpoint http://<victoriatraces>:10428/insert/opentelemetry/v1/traces
          \`\`\`

          The agent needs privileges (CAP_BPF + CAP_PERFMON + CAP_SYS_PTRACE, or \`--privileged\`) and the host pid namespace; linux/amd64, kernel with BTF and fentry/fexit (5.5+).
          NOTES
          flags=(--title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt "${flags[@]}"
